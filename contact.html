<body>
<nav class="pa-nav pa-nav--jacket">
  <div class="pa-shell">
    <a class="pa-nav-mark" href="index.html" aria-label="Home">
      <svg><use href="assets/icons.svg#pa-globe"></use></svg>
    </a>
    <ul>
      <li><a data-section href="index.html"><span class="num">01</span><span class="name">Home</span></a></li>
      <li><a data-section href="about.html"><span class="num">02</span><span class="name">About</span></a></li>
      <li><a data-section href="contact.html" aria-current="page"><span class="num">03</span><span class="name">Contact</span></a></li>
    </ul>
  </div>
</nav>

<main>

  <!-- TICKET JACKET (canvas option 1a). The globe is the link: the object you
       would pick up is the thing you press. Everything decorative is
       pointer-events: none so nothing swallows the click. -->
  <section class="pa-jacket">
    <span class="pa-jacket__crease" aria-hidden="true"></span>

    <a class="pa-jacket__mark"
       href="https://www.linkedin.com/in/hayden-guenzler/"
       target="_blank" rel="noopener noreferrer">
      <svg class="pa-jacket__plane" viewBox="0 0 100 40" aria-hidden="true"><path d="M48 4h4l2 13 26 7v4l-26-3 1 9 8 5v3l-11-3-11 3v-3l8-5 1-9-26 3v-4l26-7z"/></svg>
      <svg class="pa-jacket__globe" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46"/><line x1="50" y1="4" x2="50" y2="96"/><ellipse cx="50" cy="50" rx="17.6" ry="46"/><ellipse cx="50" cy="50" rx="32.5" ry="46"/><ellipse cx="50" cy="50" rx="42.5" ry="46"/><line x1="4" y1="50" x2="96" y2="50"/><path d="M 10.2 27 Q 50 37 89.8 27"/><path d="M 10.2 73 Q 50 83 89.8 73"/><path d="M 21.4 14 Q 50 20 78.6 14"/><path d="M 21.4 86 Q 50 92 78.6 86"/></svg>
      <span class="pa-jacket__band">LinkedIn</span>
      <!-- The band reads "LinkedIn", so the link already names itself. This
           only adds what a sighted user gets from context: that it leaves. -->
      <span class="visually-hidden">Hayden Guenzler on LinkedIn, opens in a new tab</span>
    </a>

    <div class="pa-jacket__card">
      <span class="pa-label">Passenger enquiry</span>
      <div style="display:flex;gap:28px;border-top:1px solid rgba(31,67,100,.5);padding-top:8px">
        <span class="pa-field"><span class="pa-label">Origin</span><span class="pa-data">TUL</span></span>
        <span class="pa-field"><span class="pa-label">Routing</span><span class="pa-data">LNKD</span></span>
      </div>
    </div>

    <span class="pa-jacket__grommet pa-jacket__grommet--a" aria-hidden="true"></span>
    <span class="pa-jacket__grommet pa-jacket__grommet--b" aria-hidden="true"></span>
    <span class="pa-jacket__dogear" aria-hidden="true"></span>
  </section>

</main>

<footer class="pa-footer" style="margin-top:64px">
  <div class="pa-shell">
    <dl>
      <div><dt class="pa-label">Issued</dt><dd>2026</dd></div>
      <div><dt class="pa-label">Revision</dt><dd>01</dd></div>
      <div><dt class="pa-label">Carrier</dt><dd>HG AM</dd></div>
    </dl>
    <svg class="pa-globe"><use href="assets/icons.svg#pa-globe"></use></svg>
  </div>
</footer>
</body>
